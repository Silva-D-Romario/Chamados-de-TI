spring:
  application:
    name: chamados-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chamados}
    username: ${DB_USER:chamados}
    password: ${DB_PASSWORD:chamados}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

security:
  jwt:
    secret: ${JWT_SECRET:local-development-secret-change-me-32-bytes}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
